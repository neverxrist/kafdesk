name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Tauri 2 + rdkafka (cmake). Builds macOS arm64, Windows, Linux.
# No macOS Intel (macos-13 runners are scarce / often stuck in queue).

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            rust_target: aarch64-apple-darwin
            artifact_name: mac-arm64
            bundles: dmg,app
          - platform: ubuntu-22.04
            # Native host — omit --target so cmake/rdkafka-sys don't cross-compile
            rust_target: ''
            artifact_name: linux-x64
            bundles: deb,appimage
          - platform: windows-latest
            rust_target: ''
            artifact_name: windows-x64
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target != '' && matrix.rust_target || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.artifact_name }}

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config build-essential curl wget file \
            zlib1g-dev libzstd-dev liblz4-dev \
            libssl-dev libsasl2-dev libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libfuse2
          # Prefer distro cmake over any stale /usr/local copy
          sudo rm -f /usr/local/bin/cmake || true
          hash -r
          which cmake
          cmake --version

      - name: Install Windows build deps (cmake, nasm, perl)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake nasm strawberryperl -y --no-progress
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tauri build
        shell: bash
        run: |
          set -euxo pipefail
          # Git Bash ships a broken perl; openssl-src (ssl-vendored) needs Strawberry.
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/Strawberry/perl/bin:$PATH"
            export PERL="/c/Strawberry/perl/bin/perl.exe"
            command -v perl && perl -v | head -2
          fi
          export PATH="$PWD/node_modules/.bin:$PATH"
          command -v cmake && cmake --version
          command -v tauri
          TARGET_ARGS=()
          if [ -n "${{ matrix.rust_target }}" ]; then
            TARGET_ARGS=(--target "${{ matrix.rust_target }}")
          fi

          # macOS hdiutil "Resource busy" is a known Actions flake (XProtect / I/O).
          # Retries reuse the already-compiled binary and only re-run bundling.
          # See https://github.com/actions/runner-images/issues/7522
          MAX_ATTEMPTS=1
          if [ "${{ runner.os }}" = "macOS" ]; then
            MAX_ATTEMPTS=3
            sync || true
          fi
          attempt=1
          while true; do
            if node scripts/with-cmake.mjs tauri build \
              "${TARGET_ARGS[@]}" \
              --bundles "${{ matrix.bundles }}"; then
              break
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "Tauri build failed after ${attempt} attempt(s)"
              exit 1
            fi
            echo "Tauri build failed (attempt ${attempt}/${MAX_ATTEMPTS}); retrying in 20s…"
            attempt=$((attempt + 1))
            sync || true
            sleep 20
          done
        env:
          CI: true

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out
          BUNDLE=""
          if [ -n "${{ matrix.rust_target }}" ] && [ -d "src-tauri/target/${{ matrix.rust_target }}/release/bundle" ]; then
            BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          else
            BUNDLE="src-tauri/target/release/bundle"
          fi
          echo "Looking in $BUNDLE"
          find "$BUNDLE" -type f \( \
            -name '*.dmg' -o -name '*.app' -o \
            -name '*.deb' -o -name '*.AppImage' -o \
            -name '*.msi' -o -name '*.exe' -o -name '*.nsis.zip' \
          \) -print || true

          cp -f "$BUNDLE"/dmg/*.dmg release-out/ 2>/dev/null || true
          cp -f "$BUNDLE"/deb/*.deb release-out/ 2>/dev/null || true
          cp -f "$BUNDLE"/appimage/*.AppImage release-out/ 2>/dev/null || true
          cp -f "$BUNDLE"/nsis/*.exe release-out/ 2>/dev/null || true

          APP_DIR=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' -type d 2>/dev/null | head -1 || true)
          if [ -n "${APP_DIR:-}" ] && [ -d "$APP_DIR" ]; then
            if command -v ditto >/dev/null 2>&1; then
              ditto -c -k --sequesterRsrc --keepParent \
                "$APP_DIR" \
                "release-out/KafDesk-${{ matrix.artifact_name }}.app.zip"
            else
              (cd "$(dirname "$APP_DIR")" && zip -r \
                "$GITHUB_WORKSPACE/release-out/KafDesk-${{ matrix.artifact_name }}.app.zip" \
                "$(basename "$APP_DIR")")
            fi
          fi

          for f in release-out/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              KafDesk-*) ;;
              *)
                ext="${base##*.}"
                name="${base%.*}"
                mv "$f" "release-out/${name}-${{ matrix.artifact_name }}.${ext}" 2>/dev/null || true
                ;;
            esac
          done

          ls -la release-out
          test -n "$(ls -A release-out 2>/dev/null)" || { echo "No artifacts collected"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-out/*
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp -f {} release-files/ \;
          ls -la release-files

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          body: |
            ## KafDesk ${{ github.ref_name }}

            Tauri 2 desktop client (Electron removed).

            ### Downloads
            - **macOS Apple Silicon** — `*-mac-arm64.dmg`
            - **Windows** — `*-windows-x64.exe` (NSIS)
            - **Linux** — `*-linux-x64.AppImage` / `.deb`

            Unsigned builds: on macOS you may need right-click → Open the first time.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
