name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Tauri 2 + rdkafka (cmake). Builds macOS (arm64 + x64), Windows, Linux.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            rust_target: aarch64-apple-darwin
            artifact_name: mac-arm64
            bundles: dmg,app
          # Native Intel runner — avoids cross-compiling vendored librdkafka/cmake
          - platform: macos-13
            rust_target: x86_64-apple-darwin
            artifact_name: mac-x64
            bundles: dmg,app
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            artifact_name: linux-x64
            bundles: deb,appimage
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.rust_target }}

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential curl wget file \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev

      - name: Install cmake (Windows)
        if: runner.os == 'Windows'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.x'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tauri build
        shell: bash
        run: |
          node scripts/with-cmake.mjs tauri build \
            --target "${{ matrix.rust_target }}" \
            --bundles "${{ matrix.bundles }}"
        env:
          CI: true

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          # Native-target builds may land under target/release/bundle
          if [ ! -d "$BUNDLE" ]; then
            BUNDLE="src-tauri/target/release/bundle"
          fi
          echo "Looking in $BUNDLE"
          find "$BUNDLE" -type f \( \
            -name '*.dmg' -o -name '*.app' -o \
            -name '*.deb' -o -name '*.AppImage' -o \
            -name '*.msi' -o -name '*.exe' -o -name '*.nsis.zip' \
          \) -print || true

          cp -f "$BUNDLE"/dmg/*.dmg release-out/ 2>/dev/null || true
          cp -f "$BUNDLE"/deb/*.deb release-out/ 2>/dev/null || true
          cp -f "$BUNDLE"/appimage/*.AppImage release-out/ 2>/dev/null || true
          cp -f "$BUNDLE"/msi/*.msi release-out/ 2>/dev/null || true
          cp -f "$BUNDLE"/nsis/*.exe release-out/ 2>/dev/null || true

          # Zip .app for GitHub Releases (DMG is primary for Mac)
          APP_DIR=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' -type d 2>/dev/null | head -1 || true)
          if [ -n "${APP_DIR:-}" ] && [ -d "$APP_DIR" ]; then
            if command -v ditto >/dev/null 2>&1; then
              ditto -c -k --sequesterRsrc --keepParent \
                "$APP_DIR" \
                "release-out/KafDesk-${{ matrix.artifact_name }}.app.zip"
            else
              (cd "$(dirname "$APP_DIR")" && zip -r \
                "$GITHUB_WORKSPACE/release-out/KafDesk-${{ matrix.artifact_name }}.app.zip" \
                "$(basename "$APP_DIR")")
            fi
          fi

          # Rename for clarity when multiple Mac targets collide on filename
          for f in release-out/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              KafDesk-*) ;;
              *)
                ext="${base##*.}"
                name="${base%.*}"
                mv "$f" "release-out/${name}-${{ matrix.artifact_name }}.${ext}" 2>/dev/null || true
                ;;
            esac
          done

          ls -la release-out
          test -n "$(ls -A release-out 2>/dev/null)" || { echo "No artifacts collected"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-out/*
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp -f {} release-files/ \;
          ls -la release-files

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          body: |
            ## KafDesk ${{ github.ref_name }}

            Tauri 2 desktop client (Electron removed).

            ### Downloads
            - **macOS Apple Silicon** — `*-mac-arm64.dmg`
            - **macOS Intel** — `*-mac-x64.dmg`
            - **Windows** — `*-windows-x64.exe` / `.msi`
            - **Linux** — `*-linux-x64.AppImage` / `.deb`

            Unsigned builds: on macOS you may need right-click → Open the first time.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
