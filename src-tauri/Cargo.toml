[package]
name = "kafdesk"
version = "1.0.2"
description = "KafDesk — lightweight Kafka desktop client (Tauri)"
authors = ["KafDesk contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
autobins = false

[[bin]]
name = "KafDesk"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# cmake_build + ssl-vendored → OpenSSL + builtin SCRAM/PLAIN (no Cyrus/Kerberos).
rdkafka = { version = "0.39", default-features = false, features = [
  "cmake_build",
  "tokio",
  "libz",
  "ssl-vendored",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "stream"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
apache-avro = { version = "0.22", default-features = false }
byteorder = "1"
dirs = "6"
keyring = { version = "4", default-features = false, features = ["v1"] }

[target.'cfg(windows)'.dependencies]
# Same stack Tauri/wry use — PlatformWebview::controller() → SetMemoryUsageTargetLevel.
webview2-com = "0.39"
windows = "0.62"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
