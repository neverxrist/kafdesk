# Local Kafka + Schema Registry for KafDesk smoke tests (no auth).
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: kafdesk-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: kafdesk-init-topics
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./docker/DemoEvent.avsc:/seed/DemoEvent.avsc:ro
    entrypoint:
      - bash
      - -c
      - |
        set -e
        BROKERS=redpanda:9092

        rpk topic create demo-json -p 3 -r 1 --brokers "$$BROKERS" || true
        rpk topic create demo-string -p 1 -r 1 --brokers "$$BROKERS" || true
        rpk topic create demo-avro -p 1 -r 1 --brokers "$$BROKERS" || true

        # Sample Avro: id (string), count (int), active (boolean)
        for i in $$(seq 1 40); do
          if rpk registry subject list -X registry.hosts=redpanda:8081 >/dev/null 2>&1; then
            break
          fi
          sleep 0.5
        done

        rpk registry schema create demo-avro-value \
          --schema /seed/DemoEvent.avsc \
          -X registry.hosts=redpanda:8081 || true

        echo 'subjects:'
        rpk registry subject list -X registry.hosts=redpanda:8081 || true
        echo 'seed ok'
    restart: "no"
